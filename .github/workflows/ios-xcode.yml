# Generates the iOS Xcode project with Unity on a free Linux runner and publishes it as a release.
# Codemagic workflow "moon-pull-xcode-to-testflight" then compiles, signs and ships it.
#
# Secrets (Settings → Secrets and variables → Actions): UNITY_EMAIL, UNITY_PASSWORD, UNITY_LICENSE
# (contents of the Personal .ulf file — the same values as the Slice & Blast repository).
name: iOS Xcode project

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: "Unity version (must have a GameCI image)"
        required: false
        default: "6000.3.22f1"
  push:
    branches: [main, claude/intelligent-shannon-qd3fs3]
    paths: ["Assets/**", "Packages/**", "ProjectSettings/**"]

jobs:
  xcode-project:
    name: Unity → Xcode project
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Report which credentials are present
        run: |
          echo "UNITY_EMAIL set:    ${{ secrets.UNITY_EMAIL != '' }}"
          echo "UNITY_PASSWORD set: ${{ secrets.UNITY_PASSWORD != '' }}"
          echo "UNITY_LICENSE set:  ${{ secrets.UNITY_LICENSE != '' }}"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-ios-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: unity-library-ios-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: ${{ inputs.unityVersion || '6000.3.22f1' }}
          targetPlatform: iOS
          allowDirtyBuild: true
          # Our own entry point: it generates content and sets MOONPULL_ADMOB / MOONPULL_ATT before building.
          buildMethod: MoonPull.EditorTools.MoonPullBuild.BuildIos

      - name: Package the Xcode project
        run: |
          set -eu
          cd build/iOS
          zip -qr "$GITHUB_WORKSPACE/ios-xcode.zip" iOS
          ls -la "$GITHUB_WORKSPACE/ios-xcode.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcode
          path: ios-xcode.zip
          retention-days: 7

      - name: Publish as an ios-xcode release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="ios-xcode-${{ github.run_id }}"
          for attempt in 1 2 3; do
            if gh release create "$TAG" ios-xcode.zip --latest \
                --title "iOS Xcode project ${{ github.run_id }}" \
                --notes "Generated from ${{ github.sha }}." \
                --target "${{ github.sha }}"; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1
